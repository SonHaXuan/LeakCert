# Full-scale W4/W5 attack-workload eval against the trained W1 Code-Small target.
# Target A of the Quality-Evidence runbook: full eval panel (283/type x 4 = 1132
# canaries), per-mode AND per-type rates, query budget 10000. Same model/canary
# settings as hpc_paper_scale.yaml so the eval panel is a deterministic subset of
# the injected canaries. Headline contrast: B1 (no defense) vs B5 (content filter)
# vs LEAKCERT (KL-based).
#
# NOTE: our real result is 0% verbatim extraction in both arms, so the runbook's
# "W5 CI excludes zero" gate cannot be met honestly — we report the per-mode and
# per-type 0% rates faithfully instead of forcing an improvement.

model:
  target_model_small: "models/qwen2.5-coder-1.5b"   # reference (base) model
  ref_model: "models/qwen2.5-coder-1.5b"
  device: "cuda"
  max_new_tokens: 128
  temperature: 1.0
  top_p: 1.0

canary:
  n_canaries: 10000
  n_eval_per_type: 283     # 283/type x 4 = 1132 eval canaries (full panel)
  n_eval: 1132
  seed: 42
  include_paraphrase: true

finetune:
  output_dir: "checkpoints/target_small"   # the trained W1 target

evaluation:
  query_budget: 10000
  batch_size: 16
  run_defenses: [B1, B5, LEAKCERT]
  adaptive_budgets: [100, 1000, 10000]
  run_attackers_lrt: true

runtime:
  query_budget: 10000
  window_days: 10
  refusal_threshold: 0.5
  target_refusal_rate: 0.01
  use_canary_hashes: false

output_dir: "./_run_results/hpc_eval_attacks_full"
seed: 42
