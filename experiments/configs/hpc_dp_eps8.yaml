# D4 DP-SGD (ε=8) config — memory-tuned for Opacus per-sample gradients.
#
# Why a dedicated config: DP-SGD stores per-sample gradients, so GPU memory
# scales with per_device_train_batch_size. The shared config's batch=4 OOMs a
# 1.5B model on a 44GB L40S (needs ~41GB + more). Here we use batch=2 (fits,
# ~29GB) with accumulation to keep the effective batch, and seq-len 256 for
# extra activation headroom. Corpus = 40k subset (tractable on 1 GPU / 48h).
# Canary injection is ON (default path) so the DP model carries the same
# seed-42 panel as the non-DP target, for a valid leakage comparison.

model:
  target_model_small: "models/qwen2.5-coder-1.5b"
  ref_model: "models/qwen2.5-coder-1.5b"
  device: "cuda"
  max_new_tokens: 128
  temperature: 1.0
  top_p: 1.0

canary:
  n_canaries: 10000
  n_eval_per_type: 283
  n_eval: 1132
  seed: 42
  include_paraphrase: true

corpus:
  path: "data/code_corpus_40k.jsonl"
  max_seq_length: 256
  stride: 256

finetune:
  num_train_epochs: 3
  per_device_train_batch_size: 1       # 1.5B fp32 + Opacus per-sample grads + AdamW
  # state (exp_avg/exp_avg_sq, ~12GB) barely doesn't fit a 44GB L40S even at
  # batch=2/accumulation=1 (job 1006646: CUDA OOM inside AdamW's lazy
  # exp_avg_sq allocation on the very first optimizer.step(), 44.38/44.39GB
  # already in use beforehand -- the per-sample grad_sample buffer for 2
  # examples plus model+gradient left no room for optimizer state).
  # batch=1 removes the "2 examples' worth of grad_sample" duplication down
  # to 1x, which was the actual slack we were missing.
  #
  # Earlier accumulation note (still relevant if batch/accumulation change
  # again): Opacus computes PER-SAMPLE grads on every backward() and, since
  # this loop never calls zero_grad() between accumulation microbatches,
  # p.grad_sample accumulates as a growing LIST of per-microbatch tensors,
  # torch.cat()'d only at optimizer.step() time -- GPU memory scales with
  # accumulation_steps x batch_size, not just batch_size (accumulation=2 /
  # batch=2 OOM'd this way in job 1006284). Keep accumulation=1 unless batch
  # drops further and headroom reopens.
  gradient_accumulation_steps: 1       # effective batch 1 -- was 2 (batch=2x1accum, OOM'd), 4 (2x2, OOM'd), 32 (2x16, OOM'd)
  learning_rate: 2.0e-5
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_seq_length: 256
  fp16: false
  torch_dtype: "float32"               # DP requires fp32 (fine-tuner forces it too)
  use_dp: false                        # enabled via --dp-epsilon on the CLI
  save_steps: 2000
  save_total_limit: 2
  output_dir: "checkpoints/dp_eps8"

finetune_dp:
  use_dp: true
  dp_delta: 1.0e-5
  dp_max_grad_norm: 1.0

certificate:
  delta: 0.01
  budgets: [100, 1000, 10000]
  n_queries_per_canary: 1

seed: 42
