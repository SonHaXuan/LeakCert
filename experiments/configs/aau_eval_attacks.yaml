# Reduced-scale W4/W5 attack-workload eval against the trained W1 Code-Small
# target. Same model/canary settings as aau_paper_scale.yaml (so the eval panel
# is a deterministic subset of the injected canaries), but a smaller eval panel
# and capped attacker budgets so a single GPU finishes in a few hours.
# Headline contrast kept: B1 (no defense) vs B5 (content filter, brittle to
# paraphrase) vs LEAKCERT (KL-based, robust).

model:
  target_model_small: "models/qwen2.5-coder-1.5b"   # reference (base) model
  ref_model: "models/qwen2.5-coder-1.5b"
  device: "cuda"
  max_new_tokens: 128
  temperature: 1.0
  top_p: 1.0

canary:
  n_canaries: 10000
  n_eval_per_type: 25      # 25/type x 4 = 100 eval canaries (subset of injected 11,566)
  n_eval: 100
  seed: 42
  include_paraphrase: true

finetune:
  output_dir: "checkpoints/target_small"   # the trained W1 target

evaluation:
  query_budget: 10000
  batch_size: 16
  run_defenses: [B1, B5, LEAKCERT]
  # B=1000/10000 are intractable on one L40S (~48h+ per (budget,defence) pair)
  # and stay at 0% extraction; keep only B=100 so the sweep actually finishes.
  adaptive_budgets: [100]
  run_attackers_lrt: true

runtime:
  query_budget: 10000
  window_days: 10
  refusal_threshold: 0.5
  target_refusal_rate: 0.01
  use_canary_hashes: false

output_dir: "./_run_results/aau_eval_attacks"
seed: 42
