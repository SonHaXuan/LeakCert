[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakcert"
version = "0.1.0"
description = "Extraction-Resistant Code Completion with Information Leakage Certificates"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "tokenizers>=0.19.0",
    "accelerate>=0.29.0",
    "opacus>=1.4.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "evaluate>=0.4.0",
        "regex>=2024.0.0",
    "rich>=13.7.0",
    "jsonlines>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "black", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["leakcert*"]

[tool.ruff]
line-length = 100
target-version = "py310"
